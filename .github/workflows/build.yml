name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci --prefix tools
      - run: npm test --prefix tools
      - name: Build and test x86 plugin
        shell: pwsh
        run: |
          $arguments = @{ Tests = $true }
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
            if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$') {
              throw "Expected a version tag such as v0.1.0 or v0.2.0-beta.1"
            }
            $arguments.Version = $version
          }
          ./build.ps1 @arguments
          if ($arguments.ContainsKey('Version')) {
            $actual = (Get-Item dist/AlwaysOfficial.dll).VersionInfo.ProductVersion -replace '\+.*$', ''
            if ($actual -ne $version) { throw "DLL version '$actual' does not match tag '$version'" }
          }
          Copy-Item product/version.yaml dist/version.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: AlwaysOfficial-win-x86
          path: dist/
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) {
            $arguments = @('release', 'create', $env:GITHUB_REF_NAME, '--verify-tag', '--generate-notes', '--draft')
            gh @arguments
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $env:GITHUB_REF_NAME dist/AlwaysOfficial.dll dist/AlwaysOfficial.pdb dist/version.yaml --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          $prerelease = if ($env:GITHUB_REF_NAME.Contains('-')) { 'true' } else { 'false' }
          gh release edit $env:GITHUB_REF_NAME --draft=false "--prerelease=$prerelease"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }

  pages:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: modloader-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci --prefix tools
      - uses: actions/configure-pages@v5
        id: pages
      - name: Generate ModLoader feeds and archives
        run: node tools/modloader-server.mjs site
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
