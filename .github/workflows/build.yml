name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test --project AlwaysOfficial.Tests/AlwaysOfficial.Tests.csproj -c Release

      - name: Build and package x86 plugin
        run: dotnet publish AlwaysOfficial/AlwaysOfficial.csproj -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: AlwaysOfficial-win-x86
          path: |
            dist/AlwaysOfficial.dll
            dist/AlwaysOfficial-modloader.zip
            dist/AlwaysOfficial-standalone.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Item dist/AlwaysOfficial.dll).VersionInfo.ProductVersion -replace '\+.*$', ''
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$version" }
          gh release create $tag dist/AlwaysOfficial.dll dist/AlwaysOfficial-modloader.zip dist/AlwaysOfficial-standalone.zip --target $env:GITHUB_SHA --generate-notes "--prerelease=$($tag.Contains('-'))"
