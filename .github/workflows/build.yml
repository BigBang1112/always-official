name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check ModLoader JSON indexes
        shell: pwsh
        run: ./modloader/test-index.ps1
      - name: Build and test x86 plugin
        shell: pwsh
        run: |
          $arguments = @{ Tests = $true }
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
            if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$') {
              throw "Expected a version tag such as v0.1.0 or v0.2.0-beta.1"
            }
            $arguments.Version = $version
          }
          ./build.ps1 @arguments
          if ($arguments.ContainsKey('Version')) {
            $actual = (Get-Item dist/AlwaysOfficial.dll).VersionInfo.ProductVersion -replace '\+.*$', ''
            if ($actual -ne $version) { throw "DLL version '$actual' does not match tag '$version'" }
          }
          Copy-Item modloader/version.yaml dist/version.yaml
          Compress-Archive -LiteralPath dist/AlwaysOfficial.dll -DestinationPath dist/AlwaysOfficial-modloader.zip -Force
          Compress-Archive -LiteralPath dist/AlwaysOfficial.dll,dist/d3d9.dll -DestinationPath dist/AlwaysOfficial-standalone.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: AlwaysOfficial-win-x86
          path: dist/
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existing = gh release view $env:GITHUB_REF_NAME --json isDraft
          if ($LASTEXITCODE -eq 0) {
            if (($existing | ConvertFrom-Json).isDraft) { throw 'A draft already exists for this tag; resolve it before retrying.' }
            Write-Host 'Release already published; leaving its immutable assets unchanged.'
            exit 0
          }
          # Upload every asset while the release is a draft, before immutability applies.
          gh release create $env:GITHUB_REF_NAME dist/AlwaysOfficial.dll dist/AlwaysOfficial.pdb dist/AlwaysOfficial-modloader.zip dist/AlwaysOfficial-standalone.zip dist/version.yaml --verify-tag --generate-notes --draft
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          $prerelease = if ($env:GITHUB_REF_NAME.Contains('-')) { 'true' } else { 'false' }
          gh release edit $env:GITHUB_REF_NAME --draft=false "--prerelease=$prerelease"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }

  pages:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: modloader-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - name: Generate ModLoader JSON feeds from published releases
        shell: pwsh
        run: ./modloader/build-index.ps1
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
