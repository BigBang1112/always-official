name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Build and publish]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event != 'pull_request'
    
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: modloader-pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages
      
      - name: Generate the ModLoader feed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/modloader
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp -H 'Accept: application/vnd.github.text+json' |
            jq -e --arg homepage "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" '
              def modloader_archive:
                (.tag_name | ltrimstr("v")) as $version |
                first(.assets[]? | select(.name == "AlwaysOfficial-modloader.v\($version).zip")) //
                first(.assets[]? | select(.name == "AlwaysOfficial-modloader.zip")) // null;

              add | map(select(
                .draft == false and .prerelease == false and
                (modloader_archive != null)
              )) |
              max_by(.published_at) as $release |
              if $release == null then
                {api: 1, game: "TmForever", products: {}}
              else
                ($release | modloader_archive) as $archive |
                if (($archive.digest // "") | test("^sha256:[0-9a-fA-F]{64}$")) then
                  {
                    api: 1,
                    game: "TmForever",
                    products: {
                      "Always Official": {
                        name: "Always Official",
                        author: "BigBang1112",
                        type: "modification",
                        description: "After entering official mode manually, restart subsequent solo runs in official mode without repeating the confirmation.",
                        homepage: $homepage,
                        versions: {
                          ($release.tag_name | ltrimstr("v")): ({
                            executable: "AlwaysOfficial.dll",
                            dependencies: [{id: "CoreMod", version: "^1.0.1"}],
                            download_link: $archive.browser_download_url,
                            hash_sha256: ($archive.digest | ltrimstr("sha256:"))
                          } + if (($release.body_text // "") | test("\\S")) then
                            {changelog: $release.body_text}
                          else {} end)
                        }
                      }
                    }
                  }
                else error("The ModLoader archive has no valid SHA-256 digest") end
              end
            ' > site/modloader/index.json
      
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment
